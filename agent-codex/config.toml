cli_auth_credentials_store = "file"
default_permissions = "openbot-agent"

[history]
persistence = "none"

[permissions.openbot-agent]
description = "Read-only runtime for the private OpenBot Codex adapter."
extends = ":read-only"

[permissions.openbot-agent.filesystem]
":minimal" = "read"
":workspace_roots" = "read"
"~/.codex" = "deny"

[permissions.openbot-agent.network]
enabled = false
