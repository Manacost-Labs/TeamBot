cli_auth_credentials_store = "file"
default_permissions = "openbot-agent"

[history]
persistence = "none"

[features]
apps = false
browser_use = false
computer_use = false
goals = false
hooks = false
image_generation = false
in_app_browser = false
in_app_local_automation = false
multi_agent = false
plugin_sharing = false
plugins = false
remote_plugin = false
skill_search = false
workspace_dependencies = false

[permissions.openbot-agent]
description = "Read-only runtime for the private OpenBot Codex adapter."
extends = ":read-only"

[permissions.openbot-agent.filesystem]
":minimal" = "read"
":workspace_roots" = "read"
"~/.codex" = "deny"

[permissions.openbot-agent.network]
enabled = false

[permissions.youtube-analyst-agent]
description = "Read-only YouTube summary runtime; the trusted adapter preloads transcripts."
extends = ":read-only"

[permissions.youtube-analyst-agent.filesystem]
":minimal" = "read"
":workspace_roots" = "read"
"/youtube-workspace" = "read"
"~/.codex" = "deny"

[permissions.youtube-analyst-agent.network]
enabled = false

[permissions.data-control-agent]
description = "Workspace-scoped repair runtime for the parser maintainer."
extends = ":read-only"

[permissions.data-control-agent.filesystem]
":minimal" = "read"
":workspace_roots" = "write"
"/workspace/.git" = "write"
"~/.codex" = "deny"

[permissions.data-control-agent.network]
enabled = false

[permissions.heartpulse-control-agent]
description = "Workspace-scoped end-to-end repair runtime for the HeartPulse maintainer."
extends = ":read-only"

[permissions.heartpulse-control-agent.filesystem]
":minimal" = "read"
":workspace_roots" = "write"
"/workspace/.git" = "write"
"/workspace-heartpulse" = "write"
"/workspace-heartpulse/.git" = "write"
"~/.codex" = "deny"

[permissions.heartpulse-control-agent.network]
enabled = false

[permissions.research-agent]
description = "Read-only evidence research runtime with isolated report output."
extends = ":read-only"

[permissions.research-agent.filesystem]
":minimal" = "read"
":workspace_roots" = "read"
"/workspace-research" = "read"
"/research-runs" = "write"
"~/.codex" = "deny"

[permissions.research-agent.network]
enabled = true
