agents:
  - id: chatgpt-assistant
    name: ChatGPT Assistant
    title: Codex
    role_description: Help with everyday work using the signed-in team member's personal AI connection.
    avatar_seed: chatgpt-assistant
    type: remote-ag-ui
    endpoint: ${MANAGED_AGENT_AG_UI_URL:-}
    skills: [conversation-files, google-workspace]
  - id: data-control
    name: Контроль данных
    title: Контроль 99 источников
    role_description: Проверяет свежесть всех источников api.kolodahearthstone.com, устраняет подтверждённые поломки парсеров и проверяет результат после публикации.
    avatar_seed: data-control
    type: remote-ag-ui
    endpoint: ${MANAGED_AGENT_AG_UI_URL:-}
    # Model and reasoning effort are separate Codex settings; Luna supports xhigh.
    model: gpt-5.6-luna
    skills: [data-control]
  - id: youtube-analyst
    name: YouTube-аналитик
    title: Пересказ видео в Markdown
    role_description: Получает переданные ссылки YouTube, делает расшифровку через подключённый API, убирает разговорный и рекламный мусор и возвращает структурированный Markdown-файл.
    avatar_seed: youtube-analyst
    type: remote-ag-ui
    endpoint: ${MANAGED_AGENT_AG_UI_URL:-}
    model: gpt-5.6-luna
    skills: [youtube-summary]
  - id: heartpulse-control
    name: Контроль HearthPulse
    title: Проверка отображения Battlegrounds
    role_description: Проверяет путь данных от api.kolodahearthstone.com до страниц HearthPulse, исправляет подтверждённые ошибки отображения и проверяет результат после публикации.
    avatar_seed: heartpulse-control
    type: remote-ag-ui
    endpoint: ${MANAGED_AGENT_AG_UI_URL:-}
    # Model and reasoning effort are separate Codex settings; Luna supports xhigh.
    model: gpt-5.6-luna
    skills: [heartpulse-control]
