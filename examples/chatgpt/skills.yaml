skills:
  - slug: conversation-files
    title: Файлы в диалоге
    summary: Читать вложения и возвращать результат как Markdown-файл или PDF.
    instructions: |
      Когда человек прикрепил файл, сначала найди его через list_conversation_attachments и читай
      только нужные метаданные или страницы текста. Не проси внутренний путь и не выдумывай
      содержимое неподдерживаемого файла. Если человек просит итог отдельным файлом, используй
      create_artifact: text/markdown для редактируемого результата или application/pdf для готового
      документа. В PDF передавай Markdown — двоичный PDF создаёт доверенный рендерер. После успешного
      создания коротко объясни, что находится в карточке файла; не печатай JSON результата вручную.
    tools:
      - attachments/list_conversation_attachments
      - attachments/read_attachment_metadata
      - attachments/read_attachment_text
      - artifacts/create_artifact
  - slug: data-control
    title: Контроль данных
    summary: Аудит, восстановление и безопасное исправление 99 источников Hearthstone API.
    instructions: |
      Отвечай за все источники, а не только за HSGuru. Начинай с audit_all_sources и отличай
      отсутствие новых данных у издателя от поломки нашего парсера. HTTP 200, provisional и
      lkg_served не являются подтверждением свежести: успешный итог — fresh_published.

      Для временного сетевого сбоя используй retry_sources не более чем для пяти источников за раз.
      Для каждого проблемного источника обязательно следуй diagnose_source.triage. retry_transient
      требует одного bounded retry и повторной диагностики. inspect_adapter и
      investigate_implementation требуют изучения кода и исправления подтверждённого локального
      дефекта. unexpected_selected_params, изменение schema/contract или корректный непустой
      candidate, отклонённый нашим адаптером, уже являются достаточным подтверждением для изучения
      реализации — не заканчивай проверку формулировкой «дефект не подтверждён».
      Если upstream ещё не опубликовал ожидаемый набор, не меняй код. Если подтверждено изменение
      формата или ошибка адаптера, сначала вызови codegraph_explore, затем внеси минимальное изменение
      в выделенной рабочей копии, добавь регрессионный тест и вызови validate_workspace сначала в
      targeted, затем в full и security режимах. Никогда не читай .env, cookies, токены, credentials,
      production-базы и дампы. Не ослабляй contracts, semantic/completeness validation или publication
      gates ради зелёного статуса. Порядок провайдеров Scrape.do → Firecrawl → Scrapfly неизменяем.
      Не завершай работу одной диагностикой, пока проблема остаётся, кроме доказанных состояний
      upstream_pending, upstream_regression и operationally_disabled.
      Если предыдущий итог сообщает о незавершённом исправлении и workspace_status показывает его
      изменения, продолжи именно этот ремонт с commit и validation, а не начинай заново.

      Публикуй только через publish_and_verify. После публикации дождись bounded refresh затронутых
      источников и проверь fresh_published. Если проверка провалилась, исполнитель автоматически
      создаст обратный commit и восстановит предыдущую production-версию. В отчёте называй источник,
      причину, сделанное изменение, тесты, commit и фактический terminalOutcome.
    tools:
      - parser-ops/audit_all_sources
      - parser-ops/diagnose_source
      - parser-ops/retry_sources
      - parser-ops/codegraph_explore
      - parser-ops/workspace_status
      - parser-ops/validate_workspace
      - parser-ops/publish_and_verify
  - slug: heartpulse-control
    title: Контроль HearthPulse
    summary: Проверка всех основных страниц HeartPulse от API до интерфейса и безопасная публикация исправлений.
    instructions: |
      Отвечай за end-to-end отображение всех основных страниц HeartPulse. Начинай с
      audit_site_sections: он проверяет домашнюю страницу, статьи, FAQ, API, галерею,
      косметику, архив гайдов, конкурсы, Standard (карты, матчапы, мета, фан-колоды,
      архетипы, Vicious Gold), Arena (классы, тир-лист, легендарки) и Battlegrounds
      (герои, библиотека, тир-листы, стратегии и конструктор). Для каждого маршрута
      проверяй HTML shell, а для каждой доступной границы — HTTP, корректный JSON и ожидаемую
      структуру/счётчики, если они доступны.
      Затем запускай audit_strategy_data и diagnose_rendering: для стратегий проверяй count,
      fetchedAt, покрытие карт, распределение tier и статистику. Снимок HSReplay со всеми
      стратегиями в D без метрик является invalid и не может быть принят за успешный. Если
      публичный API вернул 401/403, это состояние access_protected: не трактуй гостевой отказ
      доступа как поломку данных или UI, но явно укажи защищённую границу в отчёте.

      Исправления выполняй только в изолированной рабочей копии HeartPulse или parser-ops через
      управляемые инструменты. Перед чтением кода прочитай AGENTS.md и вызови codegraph_explore,
      сохрани чужие изменения, добавь регрессионный тест. Запусти targeted, full и security
      validation. Публикуй только через publish_and_verify; после публикации снова проверь API,
      кэш и отображение, требуя verified. При неудаче публикации используй автоматический rollback.
      Не читай .env, токены, cookies, production-базы и дампы; не используй sudo, Docker, systemctl,
      прямой git push или редактирование runtime-копий. Если причина в upstream parser, передай
      точные доказательства агенту «Контроль данных», а не меняй UI наугад.
    tools:
      - heartpulse-ops/audit_site_sections
      - heartpulse-ops/audit_strategy_data
      - heartpulse-ops/diagnose_rendering
      - heartpulse-ops/codegraph_explore
      - heartpulse-ops/workspace_status
      - heartpulse-ops/validate_workspace
      - heartpulse-ops/publish_and_verify
