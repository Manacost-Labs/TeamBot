services:
  attachment-storage-init:
    image: openbot-work:local
    restart: "no"
    user: "0:0"
    entrypoint:
      - /bin/sh
      - -eu
      - -c
    command:
      - chmod 0700 /var/lib/openbot/attachments && chown pwuser:pwuser /var/lib/openbot/attachments
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
    security_opt:
      - no-new-privileges:true
    volumes:
      - openbot-attachments:/var/lib/openbot/attachments

  agent-computer:
    image: openbot-work:local
    restart: unless-stopped
    user: pwuser:pwuser
    working_dir: /app
    entrypoint:
      - /usr/local/bin/bun
      - agent-computer/src/index.ts
    environment:
      PORT: "4100"
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:?COMPUTER_TOKEN is required}
      WORKSPACE_DIR: /workspace
      PROFILES_DIR: /profiles
    volumes:
      - openbot-workspace:/workspace
      - openbot-profiles:/profiles
    healthcheck:
      test:
        - CMD
        - /usr/local/bin/bun
        - -e
        - const r=await fetch('http://127.0.0.1:4100/health');process.exit(r.ok?0:1)
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app

  artifact-renderer:
    build:
      context: ./artifact-renderer
      dockerfile: Dockerfile
    restart: unless-stopped
    init: true
    environment:
      PORT: "8080"
      ARTIFACT_RENDERER_TOKEN: ${ARTIFACT_RENDERER_TOKEN:?ARTIFACT_RENDERER_TOKEN is required}
    read_only: true
    tmpfs:
      - /tmp:size=268435456,mode=1777
    shm_size: 256mb
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    networks:
      - artifact-render

  openbot:
    image: openbot-work:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      EMBEDDED_POSTGRES: "on"
      EMBEDDED_COMPUTER: "off"
      DATABASE_URL: postgres://openbot@127.0.0.1:5432/openbot
      TENANT_PACKAGE_DIR: /app/examples/chatgpt
      ATTACHMENT_STORAGE_DIR: /var/lib/openbot/attachments
      ATTACHMENT_MAX_BYTES: ${ATTACHMENT_MAX_BYTES:-26214400}
      ARTIFACT_RENDERER_URL: http://artifact-renderer:8080
      ARTIFACT_RENDERER_TOKEN: ${ARTIFACT_RENDERER_TOKEN:?ARTIFACT_RENDERER_TOKEN is required}
      OPENBOT_SINGLE_USER: "true"
      OPENBOT_PUBLIC_URL: https://work-origin.kolodahearthstone.com
      OPENBOT_APP_URL: https://work-origin.kolodahearthstone.com
      TRUSTED_ORIGINS: https://work-origin.kolodahearthstone.com
      MANAGED_AGENT_AG_UI_URL: http://agent-codex:4202/ag-ui
      AGENT_ENDPOINT_ALLOWED_HOSTS: "agent-codex:4202,editor-gateway:8080"
      AGENT_CONNECTION_TEST_TIMEOUT_MS: "45000"
      AGENT_COMPUTER_URL: http://agent-computer:4100
      COMPUTER_TOKEN: ${COMPUTER_TOKEN:?COMPUTER_TOKEN is required}
      PARSER_OPS_URL: http://host.docker.internal:4031
      HEARTPULSE_OPS_URL: http://host.docker.internal:4032
      WORKER_SHARED_SECRET: ${AGENT_TOOL_TOKEN}
    ports:
      - "127.0.0.1:3021:3001"
    volumes:
      - openbot-postgres:/var/lib/postgresql
      - openbot-attachments:/var/lib/openbot/attachments
      - ./docker/s6/scripts/migrate.sh:/etc/s6-overlay/scripts/migrate.sh:ro
    depends_on:
      attachment-storage-init:
        condition: service_completed_successfully
      artifact-renderer:
        condition: service_healthy
      agent-computer:
        condition: service_healthy
      agent-codex:
        condition: service_healthy
      editor-gateway:
        condition: service_healthy
    networks:
      - app
      - artifact-render
    extra_hosts:
      - "host.docker.internal:host-gateway"

  routine-worker:
    image: openbot-work:local
    restart: unless-stopped
    # Embedded Postgres generates its password inside the data volume, outside `.env`. The worker is
    # trusted server code, so it reads that one file through a read-only mount and never puts the
    # password in Compose, an image layer, or the model-facing agent container.
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - password=$$(cat /run/openbot-postgres/pgpassword); export DATABASE_URL="postgres://openbot:$${password}@127.0.0.1:5432/openbot"; exec bun worker/src/index.ts
    env_file: .env
    environment:
      SERVER_INTERNAL_URL: http://127.0.0.1:3001
      WORKER_SHARED_SECRET: ${AGENT_TOOL_TOKEN}
    volumes:
      - openbot-postgres:/run/openbot-postgres:ro
    network_mode: service:openbot
    depends_on:
      openbot:
        condition: service_healthy

  agent-codex:
    build:
      context: .
      dockerfile: agent-codex/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4202"
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN}
      AGENT_TOOL_TOKEN: ${AGENT_TOOL_TOKEN}
      CODEX_MODEL: ${CODEX_MODEL:-}
      # The default assistant may use the deployment's configured model; control agents override
      # this per-agent with GPT-5.6 Luna xhigh. Concise summaries are streamed to the Russian
      # progress card; private reasoning tokens never leave the model.
      CODEX_REASONING_EFFORT: ${CODEX_REASONING_EFFORT:-low}
      CODEX_REASONING_SUMMARY: ${CODEX_REASONING_SUMMARY:-concise}
      CODEX_MAX_ACTIVE_RUNS: ${CODEX_MAX_ACTIVE_RUNS:-4}
      CODEX_MAX_ACTIVE_RUNS_PER_AGENT: ${CODEX_MAX_ACTIVE_RUNS_PER_AGENT:-2}
      CODEX_MAX_QUEUED_RUNS: ${CODEX_MAX_QUEUED_RUNS:-32}
      CODEX_MAX_QUEUE_WAIT_MS: ${CODEX_MAX_QUEUE_WAIT_MS:-60000}
      RESEARCH_AGENT_ID: ${RESEARCH_AGENT_ID:-research-analyst}
      RESEARCH_MODEL: gpt-5.6-luna
      RESEARCH_REASONING_EFFORT: xhigh
      RESEARCH_SOURCES_URL: http://research-sources:8777
      RESEARCH_SOURCE_GATEWAY_TOKEN: ${AGENT_TOOL_TOKEN}
      OPENBOT_TOOL_URL: http://openbot:3001/api/agent-tools/call
    volumes:
      - /home/debian/.codex/auth.json:/home/bun/.codex/auth.json
      - /srv/projects/agents/control-data/api:/workspace
      - /srv/projects/web/HeartPulse-worktrees/heartpulse-control:/workspace-heartpulse
      - ../ResearchTeam:/workspace-research:ro
      - research-runs:/research-runs
    security_opt:
      # Codex creates its own bwrap namespace. Docker's default seccomp profile blocks that setup;
      # opening it here preserves the inner workspace-only profile and credential deny rule.
      - seccomp=unconfined
      - apparmor=unconfined
    cap_add:
      # Required by OpenAI's supported secure-container profile so setuid bubblewrap can build the
      # inner filesystem sandbox as the non-root service user.
      - SYS_ADMIN
      - SYS_CHROOT
      - SETUID
      - SETGID
      - SYS_PTRACE
    depends_on:
      research-sources:
        condition: service_healthy
    networks:
      - app

  research-sources:
    build:
      context: ../ResearchTeam
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      SOURCE_GATEWAY_TOKEN: ${AGENT_TOOL_TOKEN}
      HEARTHSTONE_STATS_API_URL: https://api.kolodahearthstone.com/v1
      REDDITAPIS_KEY: ${RESEARCH_REDDITAPIS_KEY:?RESEARCH_REDDITAPIS_KEY is required}
      GETXAPI_KEY: ${RESEARCH_GETXAPI_KEY:?RESEARCH_GETXAPI_KEY is required}
      TINYFISH_API_KEY: ${RESEARCH_TINYFISH_API_KEY:?RESEARCH_TINYFISH_API_KEY is required}
    networks:
      - app

  editor-analyzer:
    build:
      context: ../EditorTeam
      dockerfile: Dockerfile
      target: analyzer
    restart: unless-stopped
    networks:
      - app

  editor-gateway:
    build:
      context: ../EditorTeam
      dockerfile: Dockerfile
      target: gateway
    restart: unless-stopped
    environment:
      EDITOR_ADDR: ":8080"
      EDITOR_ANALYZER_URL: http://editor-analyzer:8731
      EDITOR_PROVIDER: agui
      EDITOR_AGUI_URL: http://agent-codex:4202/ag-ui
      EDITOR_AGUI_TOKEN: ${MANAGED_AGENT_TOKEN}
      EDITOR_MODEL: gpt-5.6-luna
      EDITOR_REASONING_EFFORT: xhigh
      EDITOR_MAX_ATTEMPTS: "3"
      EDITOR_TIMEOUT_SEC: "240"
      EDITOR_MAX_TEXT_BYTES: "524288"
    depends_on:
      agent-codex:
        condition: service_healthy
      editor-analyzer:
        condition: service_healthy
    networks:
      - app

  edge-auth:
    build:
      context: .
      dockerfile: edge-auth/Dockerfile
    restart: unless-stopped
    environment:
      OPENBOT_SESSION_SECRET: ${OPENBOT_SESSION_SECRET}
      CHATGPT_GATEWAY_URL: https://work.kolodahearthstone.com
    ports:
      - "127.0.0.1:3030:3030"
    networks:
      - app

volumes:
  openbot-postgres:
  openbot-workspace:
  openbot-profiles:
  openbot-attachments:
  research-runs:

networks:
  app:
  artifact-render:
    internal: true
