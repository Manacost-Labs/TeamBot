services:
  openbot:
    image: openbot-work:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      EMBEDDED_POSTGRES: "on"
      DATABASE_URL: postgres://openbot@127.0.0.1:5432/openbot
      TENANT_PACKAGE_DIR: /app/examples/chatgpt
      OPENBOT_SINGLE_USER: "true"
      OPENBOT_PUBLIC_URL: https://work-origin.kolodahearthstone.com
      OPENBOT_APP_URL: https://work-origin.kolodahearthstone.com
      TRUSTED_ORIGINS: https://work-origin.kolodahearthstone.com
      MANAGED_AGENT_AG_UI_URL: http://agent-codex:4202/ag-ui
      AGENT_ENDPOINT_ALLOWED_HOSTS: agent-codex:4202
      AGENT_COMPUTER_URL: http://127.0.0.1:4100
      PARSER_OPS_URL: http://host.docker.internal:4031
      WORKER_SHARED_SECRET: ${AGENT_TOOL_TOKEN}
    ports:
      - "127.0.0.1:3021:3001"
    volumes:
      - openbot-postgres:/var/lib/postgresql
      - openbot-workspace:/workspace
      - openbot-profiles:/profiles
      - ./docker/s6/scripts/migrate.sh:/etc/s6-overlay/scripts/migrate.sh:ro
    depends_on:
      agent-codex:
        condition: service_healthy
    networks:
      - app
    extra_hosts:
      - "host.docker.internal:host-gateway"

  routine-worker:
    image: openbot-work:local
    restart: unless-stopped
    # Embedded Postgres generates its password inside the data volume, outside `.env`. The worker is
    # trusted server code, so it reads that one file through a read-only mount and never puts the
    # password in Compose, an image layer, or the model-facing agent container.
    entrypoint:
      - /bin/sh
      - -eu
      - -c
      - password=$$(cat /run/openbot-postgres/pgpassword); export DATABASE_URL="postgres://openbot:$${password}@127.0.0.1:5432/openbot"; exec bun worker/src/index.ts
    env_file: .env
    environment:
      SERVER_INTERNAL_URL: http://127.0.0.1:3001
      WORKER_SHARED_SECRET: ${AGENT_TOOL_TOKEN}
    volumes:
      - openbot-postgres:/run/openbot-postgres:ro
    network_mode: service:openbot
    depends_on:
      openbot:
        condition: service_healthy

  agent-codex:
    build:
      context: .
      dockerfile: agent-codex/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "4202"
      MANAGED_AGENT_TOKEN: ${MANAGED_AGENT_TOKEN}
      AGENT_TOOL_TOKEN: ${AGENT_TOOL_TOKEN}
      CODEX_MODEL: ${CODEX_MODEL:-}
      OPENBOT_TOOL_URL: http://openbot:3001/api/agent-tools/call
    volumes:
      - /home/debian/.codex/auth.json:/home/bun/.codex/auth.json
      - /srv/projects/agents/control-data/api:/workspace
    security_opt:
      # Codex creates its own bwrap namespace. Docker's default seccomp profile blocks that setup;
      # opening it here preserves the inner workspace-only profile and credential deny rule.
      - seccomp=unconfined
      - apparmor=unconfined
    cap_add:
      # Required by OpenAI's supported secure-container profile so setuid bubblewrap can build the
      # inner filesystem sandbox as the non-root service user.
      - SYS_ADMIN
      - SYS_CHROOT
      - SETUID
      - SETGID
      - SYS_PTRACE
    networks:
      - app

  edge-auth:
    build:
      context: .
      dockerfile: edge-auth/Dockerfile
    restart: unless-stopped
    environment:
      OPENBOT_SESSION_SECRET: ${OPENBOT_SESSION_SECRET}
      CHATGPT_GATEWAY_URL: https://work.kolodahearthstone.com
    ports:
      - "127.0.0.1:3030:3030"
    networks:
      - app

volumes:
  openbot-postgres:
  openbot-workspace:
  openbot-profiles:

networks:
  app:
