<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emotion Studio — animated avatars for AI agents</title>
<style>
:root {
  --color-jet: 0 0% 4%;
  --color-white: 0 0% 100%;
  --primary: var(--color-jet);
  --background: var(--color-white);
  --font-system: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
}
html, body { margin: 0; padding: 0; background: #0b0b0b; color: #f5f5f5; }
* { box-sizing: border-box; }
button, input { font: inherit; }

/* ===== exact bot CSS shipped by x.ai (chunk 2ypo79imiode4.css) ===== */
.grok-bot-mark{-webkit-user-select:none;user-select:none;width:100%;height:auto;display:block}
.grok-bot-mark__head{fill:var(--fg);transition:fill .6s}
.grok-bot-mark__eye{fill:var(--bg);transition:fill .6s}
.grok-bot-lazy{line-height:0;display:inline-block}
.grok-bot-mark--fill{flex-shrink:0;width:113.1%}

/* ===== page presentation (hero-style framing) ===== */
.page {
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-start;
  gap: 16px;
  padding: 14px 18px 40px;
  font-family: var(--font-system);
}
.studio-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  width: min(1400px, 100%);
  min-height: 64px;
  padding: 8px 12px 8px 16px;
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 18px;
  background: rgba(18,18,18,.92);
  box-shadow: 0 18px 50px rgba(0,0,0,.24);
  backdrop-filter: blur(16px);
}
.brand { display: flex; align-items: center; gap: 11px; min-width: max-content; }
.brand-mark { --fg: #08a96f; --bg: #07110d; width: 34px; }
.brand-name { font-size: 17px; font-weight: 720; letter-spacing: -.02em; }
.studio-nav { display: flex; align-items: center; gap: 6px; }
.nav-link {
  appearance: none;
  padding: 10px 14px;
  color: rgba(255,255,255,.62);
  border: 0;
  border-radius: 11px;
  background: transparent;
  cursor: pointer;
  font-size: 13px;
  font-weight: 620;
}
.nav-link:hover { color: #fff; background: rgba(255,255,255,.055); }
.nav-link.active { color: #62dda7; background: rgba(30,181,114,.1); }
.header-meta { color: rgba(255,255,255,.42); font: 600 11px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
.headline {
  font-weight: 600;
  font-size: clamp(30px, 5vw, 46px);
  letter-spacing: -0.02em;
  line-height: 1.05;
  text-align: center;
  margin: 0;
  white-space: nowrap;
}
.headline .inline-bot {
  --fg: hsl(var(--primary));
  --bg: hsl(var(--background));
  display: inline-block;
  width: 1em;
  height: 1em;
  transform: translateY(0.12em);
  vertical-align: baseline;
}
.headline .inline-bot svg { width: 100%; height: auto; display: block; }
.playground {
  --accent: #08a96f;
  --accent-contrast: #08110d;
  display: grid;
  grid-template-columns: minmax(340px, 430px) minmax(0, 1fr);
  align-items: start;
  gap: 18px;
  width: min(1400px, 100%);
}
.preview-card,
.panel {
  color: #f5f5f5;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 24px;
  background: #151515;
  box-shadow: 0 18px 50px rgba(0,0,0,.12);
}
.preview-card {
  position: sticky;
  top: 20px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 18px;
  min-height: 610px;
  padding: 26px 24px 22px;
}
.preview-heading { align-self: stretch; margin: 0; font-size: 16px; font-weight: 680; }
.demo-bot {
  width: min(340px, 100%);
  margin: auto 0;
  cursor: crosshair;
}
.preview-meta { width: 100%; text-align: center; }
.preview-state {
  margin: 0;
  font: 650 14px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
}
.preview-shape {
  margin: 3px 0 0;
  color: rgba(255,255,255,.52);
  font-size: 12px;
}
.motion-note {
  margin: 0;
  padding: 9px 11px;
  color: #b8f4d8;
  border: 1px solid rgba(90,224,162,.24);
  border-radius: 12px;
  background: rgba(15,138,87,.14);
  font-size: 11px;
  line-height: 1.45;
  text-align: center;
}
.playback-bar {
  display: grid;
  grid-template-columns: auto 1fr auto auto;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding-top: 16px;
  border-top: 1px solid rgba(255,255,255,.09);
}
.playback-status { display: flex; align-items: center; gap: 8px; min-width: 0; }
.status-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 14px var(--accent); }
.playback-state { overflow: hidden; text-overflow: ellipsis; font: 600 12px/1 ui-monospace, SFMono-Regular, Menlo, monospace; }
.icon-button,
.secondary-button,
.primary-button,
.filter-button,
.integration-tab {
  appearance: none;
  border: 1px solid rgba(255,255,255,.11);
  background: #222;
  color: #f5f5f5;
  cursor: pointer;
  transition: border-color .16s, background .16s, color .16s, transform .16s;
}
.icon-button:hover,
.secondary-button:hover,
.filter-button:hover,
.integration-tab:hover { border-color: rgba(255,255,255,.3); }
.icon-button { width: 34px; height: 34px; border-radius: 10px; font-size: 16px; }
.secondary-button,
.primary-button { border-radius: 11px; padding: 10px 13px; font-size: 12px; font-weight: 680; }
.primary-button { border-color: var(--accent); background: var(--accent); color: var(--accent-contrast); }
.primary-button:hover { transform: translateY(-1px); filter: brightness(1.05); }
.controls-stack { display: flex; flex-direction: column; gap: 18px; }
.panel { width: 100%; padding: 22px; }
.panel-title {
  margin: 0 0 16px;
  font-size: 16px;
  font-weight: 650;
}
.picker-section + .picker-section { margin-top: 22px; }
.picker-label,
.state-group h3 {
  margin: 0 0 10px;
  color: rgba(255,255,255,.46);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .07em;
  text-transform: uppercase;
}
.shape-grid {
  display: grid;
  grid-template-columns: repeat(6, minmax(54px, 1fr));
  gap: 9px;
}
.shape-button {
  appearance: none;
  display: grid;
  place-items: center;
  min-height: 66px;
  padding: 7px;
  color: var(--accent);
  border: 1px solid transparent;
  border-radius: 16px;
  background: #202020;
  cursor: pointer;
  transition: border-color .16s, background .16s, transform .16s;
}
.shape-button svg { pointer-events: none; }
.shape-button:hover { background: #292929; transform: translateY(-1px); }
.shape-button[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.color-grid { display: flex; flex-wrap: wrap; gap: 12px; }
.color-button {
  appearance: none;
  width: 42px;
  height: 42px;
  padding: 4px;
  border: 1px solid transparent;
  border-radius: 50%;
  background: transparent;
  cursor: pointer;
  transition: border-color .16s, transform .16s;
}
.color-button:hover { transform: scale(1.06); }
.color-button[aria-pressed="true"] { border-color: rgba(255,255,255,.34); }
.color-swatch { display: block; width: 100%; height: 100%; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.hint {
  font-size: 13px;
  color: rgba(10,10,10,.55);
  text-align: center;
  max-width: 460px;
  line-height: 1.7;
}
.hint b { color: rgba(10,10,10,.85); font-weight: 600; }
.tag {
  font-size: 11px;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: rgba(10,10,10,.45);
  border: 1px solid rgba(10,10,10,.14);
  border-radius: 999px;
  padding: 5px 10px;
  font-weight: 600;
}
.state-panel {
  width: 100%;
}
.state-panel__header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
}
.state-panel__title {
  margin: 0;
  font-size: 16px;
  font-weight: 650;
}
.state-panel__current {
  margin: 4px 0 0;
  color: rgba(255,255,255,.54);
  font-size: 13px;
}
.state-panel__current code {
  color: #fff;
  font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
}
.state-toolbar { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 18px; }
.state-search-wrap { position: relative; flex: 1 1 220px; }
.state-search {
  width: 100%;
  min-height: 38px;
  padding: 9px 12px 9px 34px;
  color: #fff;
  border: 1px solid rgba(255,255,255,.12);
  border-radius: 11px;
  outline: none;
  background: #101010;
  font-size: 12px;
}
.state-search:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 18%, transparent); }
.search-icon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: rgba(255,255,255,.42); font-size: 13px; }
.filter-buttons { display: flex; flex-wrap: wrap; gap: 6px; }
.filter-button,
.integration-tab { border-radius: 999px; padding: 9px 11px; font-size: 11px; font-weight: 650; }
.filter-button[aria-pressed="true"],
.integration-tab[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); background: color-mix(in srgb, var(--accent) 11%, #161616); }
.state-groups {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px 22px;
}
.state-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 7px;
}
.state-button,
.auto-button {
  appearance: none;
  border: 1px solid rgba(255,255,255,.11);
  border-radius: 999px;
  background: #222;
  color: #f5f5f5;
  cursor: pointer;
  font: 600 12px/1 var(--font-system);
  padding: 9px 11px;
  transition: background .16s, color .16s, border-color .16s, transform .16s;
}
.state-button:hover,
.auto-button:hover { border-color: rgba(255,255,255,.32); transform: translateY(-1px); }
.state-button:focus-visible,
.auto-button:focus-visible,
.shape-button:focus-visible,
.color-button:focus-visible { outline: 3px solid rgba(70,181,255,.38); outline-offset: 2px; }
.state-button[aria-pressed="true"],
.auto-button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-contrast); }
.thinking-hint { display: block; margin-top: 5px; color: #b8f4d8; font-size: 11px; }
.empty-states { padding: 22px; color: rgba(255,255,255,.48); text-align: center; font-size: 12px; }
.bottom-grid {
  display: grid;
  grid-template-columns: minmax(330px, .75fr) minmax(0, 1.25fr);
  gap: 18px;
  width: min(1400px, 100%);
}
.panel-header { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 16px; }
.panel-header .panel-title { margin: 0; }
.avatar-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.avatar-card {
  appearance: none;
  min-width: 0;
  padding: 14px 10px 12px;
  color: #fff;
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 16px;
  background: #1d1d1d;
  cursor: pointer;
  text-align: center;
}
.avatar-card:hover { border-color: rgba(255,255,255,.28); }
.avatar-card[aria-pressed="true"] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.avatar-thumb { width: 72px; max-width: 100%; margin: 0 auto 8px; }
.avatar-name { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; font-weight: 680; }
.avatar-details { display: block; margin-top: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: rgba(255,255,255,.44); font: 500 10px/1.35 ui-monospace, SFMono-Regular, Menlo, monospace; }
.integration-actions { display: flex; align-items: center; gap: 8px; }
.integration-tabs { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.code-block {
  min-height: 190px;
  margin: 0;
  padding: 18px;
  overflow: auto;
  color: #9aeac0;
  border: 1px solid rgba(255,255,255,.09);
  border-radius: 14px;
  background: #0c0c0c;
  font: 500 11px/1.65 ui-monospace, SFMono-Regular, Menlo, monospace;
  white-space: pre-wrap;
  word-break: break-word;
}
.integration-note { margin: 12px 0 0; color: rgba(255,255,255,.47); font-size: 11px; line-height: 1.55; }
.event-map { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 6px; margin-top: 12px; }
.event-pill { padding: 8px; border: 1px solid rgba(255,255,255,.08); border-radius: 10px; background: #1c1c1c; text-align: center; }
.event-pill b { display: block; color: rgba(255,255,255,.48); font-size: 9px; font-weight: 650; }
.event-pill code { display: block; margin-top: 4px; color: var(--accent); font-size: 10px; }
.embed-mode { background: transparent !important; overflow: hidden; }
.embed-root { display: grid; place-items: center; width: 100vw; height: 100vh; background: transparent; }
.embed-avatar { width: min(var(--avatar-size, 280px), 100vw, 100vh); }
@media (max-width: 1100px) {
  .playground { grid-template-columns: minmax(300px, 360px) minmax(0, 1fr); }
  .shape-grid { grid-template-columns: repeat(4, minmax(54px, 1fr)); }
  .event-map { grid-template-columns: repeat(3, minmax(0, 1fr)); }
}
@media (max-width: 820px) {
  .studio-header { flex-wrap: wrap; }
  .studio-nav { order: 3; width: 100%; overflow-x: auto; }
  .header-meta { display: none; }
  .playground, .bottom-grid { grid-template-columns: 1fr; }
  .preview-card { position: relative; top: auto; min-height: 520px; }
}
@media (max-width: 700px) {
  .page { gap: 30px; padding: 32px 16px; }
  .panel { padding: 18px; border-radius: 20px; }
  .state-panel__header { align-items: flex-start; }
  .state-groups { grid-template-columns: 1fr; }
  .shape-grid { grid-template-columns: repeat(3, minmax(54px, 1fr)); }
  .avatar-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .event-map { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
