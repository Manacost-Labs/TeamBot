server {
    listen 151.80.21.140:80;
    listen [2001:41d0:c:c8c::]:80;
    server_name work.kolodahearthstone.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 151.80.21.140:443 ssl;
    listen [2001:41d0:c:c8c::]:443 ssl;
    http2 on;
    server_name work.kolodahearthstone.com;

    ssl_certificate /etc/letsencrypt/live/work.kolodahearthstone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/work.kolodahearthstone.com/privkey.pem;

    # Preserve a trustworthy Origin on the same-origin login form while still sending no referrer
    # to Telegram or any other cross-origin destination.
    add_header Referrer-Policy "same-origin" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    # Telegram returns the short-lived authorization code in the query string. Do not copy it into
    # the ordinary Nginx access log; application responses and the audit store contain no code.
    location = /api/auth/telegram/callback {
        access_log off;
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $agent_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
