server {
    listen 151.80.21.140:80;
    listen [2001:41d0:c:c8c::]:80;
    server_name work-origin.kolodahearthstone.com;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 151.80.21.140:443 ssl;
    listen [2001:41d0:c:c8c::]:443 ssl;
    http2 on;
    server_name work-origin.kolodahearthstone.com;

    ssl_certificate /etc/letsencrypt/live/work-origin.kolodahearthstone.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/work-origin.kolodahearthstone.com/privkey.pem;

    add_header Content-Security-Policy "frame-ancestors https://work.kolodahearthstone.com" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;

    # A lost iframe cookie used to expose auth_request's empty 401 body as a black screen.
    # Render a small recovery page that takes the whole window through ChatGPT login again.
    error_page 401 = /edge-login-required;

    location = /edge-login-required {
        internal;
        access_log off;
        proxy_pass http://127.0.0.1:3030;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /edge-login {
        access_log off;
        proxy_pass http://127.0.0.1:3030;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /edge-logout {
        access_log off;
        proxy_pass http://127.0.0.1:3030;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    location = /_openbot_auth {
        internal;
        proxy_pass http://127.0.0.1:3030/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location / {
        auth_request /_openbot_auth;
        proxy_pass http://127.0.0.1:3021;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $agent_connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }
}
